[project]
name = "wiki-interest"
version = "0.1.0"
description = "Agent-facing tools for comparing Wikipedia article pageviews."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8,<4",
    "fpdf2>=2.7,<3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
